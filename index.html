<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AO Personal Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <canvas id="sparkles"></canvas>

  <div class="app">
    <h1>Chipi-Chapa</h1>
    <p class="subtitle">Ask anything. Chat • YouTube • Smart AI</p>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask something… paste YouTube link here"
      />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
